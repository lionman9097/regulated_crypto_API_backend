services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: crypto-poc-backend
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: 500
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://172.10.10.227:3988
      JWT_SECRET_KEY: change-me-poc-secret
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      MARKET_WS_INTERVAL_SECONDS: 2
      KPI_WS_INTERVAL_SECONDS: 5
      BINANCE_BASE_URL: https://demo-fapi.binance.com
      BINANCE_WS_BASE_URL: wss://demo-fstream.binance.com
      GLOBAL_EXPOSURE_THRESHOLD: 10000000
      MAX_LEVERAGE: 20
      REPORT_SIGNATURE_KEY: change-me-report-sig-key
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  redis:
    image: redis:7
    container_name: crypto-poc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: crypto-poc-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - backend

volumes: {}
