[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
markers =
    unit: pure unit tests, no I/O or running server required
    integration: full-stack tests, requires server at APP_BASE_URL
    kpi: KPI validation against Chapter 3 targets
    security: authentication and authorisation tests
    performance: latency measurement tests
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio
addopts = --junitxml=test-results.xml -p no:cacheprovider
log_cli = true
log_cli_level = INFO
log_file = test-results.log
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)s %(name)s: %(message)s
